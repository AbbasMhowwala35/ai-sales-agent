services:
  mongo:
    image: mongo:7
    volumes: [mongo:/data/db]
  api:
    build: .
    env_file: server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/dialstack
      NODE_ENV: production
    ports: ["4000:4000"]
    volumes: [recordings:/app/server/storage]
    depends_on: [mongo]
volumes: { mongo: {}, recordings: {} }
